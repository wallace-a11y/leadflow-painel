name: Build Fenauto ad thumbnail
on:
  push:
    paths:
      - ".github/workflows/fenauto-poster.yml"
permissions:
  contents: write
jobs:
  create-poster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract approved Fenauto video thumbnail
        env:
          VIDEO_URL: "https://media.descriptusercontent.com/v3/proxy/remux?url=https%3A%2F%2Fapi.descript.com%2Fv2%2Fpublished_projects%2F97ec08ef-b44d-4154-88f4-e914a6caac5d%2Fhls%3Fexpiration%3D1794665370416%26signature%3Dfff86f7313709c768bc6fe8957e45f8d689455d3851a89da937e4ae25f9549e2&filename=V+deo+original+para+an+ncio+Meta.mp4&mediaCacheBucketName=production-273614-media-cache&expiration=1794661770&signature=61c998ad8c3c6ad395224543c259503e828c7f0d0acc974b87a3985f90fd1667"
        run: |
          mkdir -p public/media
          curl -fL --retry 3 --max-time 180 "$VIDEO_URL" -o /tmp/fenauto-approved.mp4
          ffmpeg -hide_banner -loglevel error -y -ss 4 -i /tmp/fenauto-approved.mp4 -frames:v 1 -q:v 2 public/media/fenauto-2026-11-13.jpg
          file public/media/fenauto-2026-11-13.jpg
      - name: Commit only the thumbnail image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/fenauto-2026-11-13.jpg
          git diff --cached --quiet || (git commit -m "Add Fenauto approved video thumbnail" && git push)
